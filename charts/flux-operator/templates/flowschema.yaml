{{- if .Values.apiPriority.enabled }}
apiVersion: flowcontrol.apiserver.k8s.io/v1
kind: FlowSchema
metadata:
  name: {{ include "flux-operator.fullname" . }}
  labels:
    {{- include "flux-operator.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- toYaml (merge (dict "apf.kubernetes.io/autoupdate-spec" "false") .Values.commonAnnotations) | nindent 4 }}
spec:
  distinguisherMethod:
    type: ByUser
  matchingPrecedence: 950
  priorityLevelConfiguration:
    name: {{ .Values.apiPriority.level }}
  rules:
    - nonResourceRules:
        - nonResourceURLs:
            - '*'
          verbs:
            - '*'
      resourceRules:
        - apiGroups:
            - '*'
          clusterScope: true
          namespaces:
            - '*'
          resources:
            - '*'
          verbs:
            - '*'
      subjects:
        - kind: ServiceAccount
          serviceAccount:
            name: {{ include "flux-operator.serviceAccountName" . }}
            namespace: {{ .Release.Namespace }}
        {{- range .Values.apiPriority.extraServiceAccounts }}
        - kind: ServiceAccount
          serviceAccount:
            name: {{ .name }}
            namespace: {{ .namespace }}
        {{- end }}
{{- end }}
