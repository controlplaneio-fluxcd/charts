name: vendor

on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * 1-5'

jobs:
  flux-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the configuration.
      packages: write # for pushing helm chart artifacts.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flux Mirror CLI
        uses: fluxcd/flux-mirror/actions/setup@d4aae3d07d90976a2ca2ffe0dcb8873b1e5b33b9 # v0.15.0
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync charts
        run: flux-mirror sync sync/charts.yaml --no-progress
