name: vendor

on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * 1-5'

jobs:
  flux-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the configuration.
      packages: write # for pushing helm chart artifacts.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Flux Mirror CLI
        uses: fluxcd/flux-mirror/actions/setup@bfcc9bad78db451a58106e9574374328111e6ecf # v0.11.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync charts
        run: flux-mirror sync sync/charts.yaml --no-progress
