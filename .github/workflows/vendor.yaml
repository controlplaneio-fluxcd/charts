name: vendor

on:
  workflow_dispatch:
  schedule:
    - cron: '00 4 * * 1-5'

jobs:
  flux-mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read # for reading the configuration.
      packages: write # for pushing helm chart artifacts.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Flux Mirror CLI
        uses: fluxcd/flux-mirror/actions/setup@46c4cc591c2610e983a62876e57dcf4bf0098c69 # v0.5.0
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync charts
        run: flux-mirror sync sync/charts.yaml --no-progress
