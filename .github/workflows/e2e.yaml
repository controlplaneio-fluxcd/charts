name: e2e

on:
  push:
    branches: ['*']

permissions:
  contents: read

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Setup Flux Operator CLI
        uses: controlplaneio-fluxcd/flux-operator/actions/setup@5836c14559f39a466a7c413e55e0ee35480a0250 # v0.50.0
      - name: Setup Kubernetes Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - name: Install latest stable
        run: |
          helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
          --namespace flux-system \
          --create-namespace \
          --wait
      - name: Upgrade to current
        run: |
          helm upgrade flux-operator ./charts/flux-operator \
          --namespace flux-system \
          --wait
      - name: Deploy flux instance
        run: |
          helm install flux ./charts/flux-instance \
          --namespace flux-system \
          --set healthcheck.enabled=true \
          --wait
      - name: Check version
        run: |
          flux-operator version
