name: e2e

on:
  push:
    branches: ['*']

permissions:
  contents: read

jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Setup Flux Operator CLI
        uses: controlplaneio-fluxcd/flux-operator/actions/setup@9c0e33843d1171fe9691f9d0e37a9b336d469adb # v0.54.1
      - name: Setup Kubernetes Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      - name: Install latest stable
        run: |
          helm install flux-operator oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
          --namespace flux-system \
          --create-namespace \
          --wait
      - name: Upgrade to current
        run: |
          helm upgrade flux-operator ./charts/flux-operator \
          --namespace flux-system \
          --wait
      - name: Deploy flux instance
        run: |
          helm install flux ./charts/flux-instance \
          --namespace flux-system \
          --set healthcheck.enabled=true \
          --wait
      - name: Check version
        run: |
          flux-operator version
